name: CI Enforcement Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies (Graphviz)
      run: |
        sudo apt-get update
        sudo apt-get install -y graphviz

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .

    - name: 1. Run Pylint
      run: |
        pylint src/ --fail-under=10

    - name: 2. Generate Dependency Graph
      run: |
        pydeps src/flask_app.py --noshow -T svg -o dependency.svg
        test -f dependency.svg

    - name: 3. Run Snyk Security Scan
      continue-on-error: true
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      run: |
        npx snyk test

    - name: 4. Run Pytest
      run: |
        pytest