name: CI Suite

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install pytest psycopg[binary]
        if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
    - name: Run Pytest
      env:
        DATABASE_URL: postgresql://postgres:password@127.0.0.1:5432/test_db
        PGPASSWORD: password
        PGUSER: postgres
        PGDATABASE: test_db
        PGHOST: 127.0.0.1
        PGPORT: 5432
      run: |
        python -c "from src.models import Base, engine; Base.metadata.create_all(bind=engine)"
        
        if [ -f src/load_data.py ]; then python src/load_data.py; fi
        
        python -m pytest