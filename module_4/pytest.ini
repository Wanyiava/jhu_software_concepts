[pytest]
testpaths = tests
pythonpath = .
addopts = -q --strict-markers --cov=src --cov-branch --cov-report=term-missing --cov-fail-under=100
markers =
    web: Flask route and HTML structure tests
    buttons: Pull Data, Update Analysis, and busy-state behavior
    analysis: Analysis values, labels, and formatting
    db: PostgreSQL schema, transactions, inserts, and selects
    integration: End-to-end application flows
