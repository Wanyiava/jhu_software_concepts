[pytest]
testpaths = module_4/tests
pythonpath = module_4
addopts = -q --strict-markers --cov=module_4/src --cov-branch --cov-report=term-missing --cov-fail-under=100
markers =
    web: Flask route and HTML tests
    buttons: Button endpoints and busy state
    analysis: Analysis values and formatting
    db: Real PostgreSQL schema, inserts, and queries
    integration: End-to-end and data pipeline tests
