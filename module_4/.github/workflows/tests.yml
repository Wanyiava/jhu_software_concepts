name: Module 4 tests and documentation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: module_4
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gradcafe_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gradcafe_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg2://postgres@127.0.0.1:5432/gradcafe_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: module_4/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run all marked tests with 100% coverage
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -m "web or buttons or analysis or db or integration" --cov-report=term-missing --cov-report=xml:coverage.xml | tee coverage_summary.txt
      - name: Build Sphinx with warnings as errors
        run: python -m sphinx -W --keep-going -b html docs docs/_build/html
      - name: Upload coverage and documentation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: module-4-evidence
          path: |
            module_4/coverage_summary.txt
            module_4/coverage.xml
            module_4/docs/_build/html
